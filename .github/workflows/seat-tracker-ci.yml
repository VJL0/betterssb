name: Seat tracker CI

on:
  pull_request:
    paths:
      - services/seat-tracker/**
      - .github/workflows/seat-tracker-ci.yml
  push:
    branches:
      - main
    paths:
      - services/seat-tracker/**
      - .github/workflows/seat-tracker-ci.yml

permissions:
  contents: read

# Distinct from the root CI's ci-<ref> group, which would otherwise cancel this run.
concurrency:
  group: seat-tracker-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: services/seat-tracker

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: services/seat-tracker/uv.lock
          version: 0.12.5
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
