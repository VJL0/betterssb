name: Migrate production database

# Vercel deploys main on its own, at the same time as this runs, so a
# migration must work with the code already running: add tables and
# columns first, and drop old ones in a later release.
on:
  push:
    branches: [main]
    paths:
      - apps/api/alembic/**
      - apps/api/alembic.ini
  workflow_dispatch:

permissions:
  contents: read

# One at a time, and never cancelled halfway through.
concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Holds the DATABASE_URL_UNPOOLED secret: Neon's direct connection, since
    # its pooler runs in transaction mode.
    environment: production
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          working-directory: apps/api
          enable-cache: true

      - run: uv sync --locked

      - name: Upgrade to the latest migration
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "::error::Add the DATABASE_URL_UNPOOLED secret to the production environment."
            exit 1
          fi
          uv run alembic current
          uv run alembic upgrade head
          uv run alembic current
