name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          working-directory: apps/api
          enable-cache: true

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          uv sync --locked --directory apps/api

      # The catalog fixes declared ranges, not stale lockfile entries; a
      # leftover version can still split a package into two installs.
      - name: Lockfile has no duplicate versions
        run: pnpm dedupe --check

      # The OpenAPI schema and the client generated from it are committed.
      # Regenerate both and fail if either differs, so the API and its
      # clients can't drift apart.
      - name: API client is up to date
        run: |
          pnpm api:generate
          if [ -n "$(git status --porcelain -- apps/api/openapi.json packages/api-client/src/generated)" ]; then
            git status --short -- apps/api/openapi.json packages/api-client/src/generated
            git diff -- apps/api/openapi.json packages/api-client/src/generated
            echo "::error::Run 'pnpm api:generate' and commit the result."
            exit 1
          fi

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
