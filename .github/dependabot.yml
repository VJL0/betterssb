version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: /services/seat-tracker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      seat-tracker-python-packages:
        patterns:
          - "*"
