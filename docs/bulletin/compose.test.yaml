# Disposable integration database. Never mount a persistent database volume here.
name: betterssb-bulletin-test
services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: bulletin_test
      POSTGRES_PASSWORD: bulletin_test
      POSTGRES_DB: bulletin_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bulletin_test -d bulletin_test"]
      interval: 2s
      timeout: 2s
      retries: 30
