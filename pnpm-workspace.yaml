packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  # Its install script only checks for the prebuilt binding it already ships.
  unrs-resolver: false

# `pnpm add` uses the catalog entry when one exists, so a shared dependency
# can't get a second range; install drops entries nothing uses any more.
catalogMode: prefer
catalogPrune: true

# One version of each shared tool for every package (https://pnpm.io/catalogs).
catalog:
  "@eslint/js": ^10.0.1
  "@fontsource-variable/inter": ^5.3.0
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-query": ^5.104.4
  "@testing-library/react": ^16.3.3
  "@testing-library/user-event": ^14.6.8
  "@types/node": ^24.19.2
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.2
  axe-core: ^4.14.0
  class-variance-authority: ^0.7.1
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-react-refresh: ^0.5.7
  eslint: ^10.13.0
  globals: ^17.13.0
  jsdom: ^30.1.3
  lucide-react: ^1.59.0
  react-dom: ^19.3.1
  react: ^19.3.1
  sonner: ^2.0.8
  tailwindcss: ^4.3.3
  typescript-eslint: ^8.71.2
  vite: ^8.3.4
  vitest: ^5.0.5
  # TypeScript 7 has no compiler API yet, so tools that import "typescript"
  # (typescript-eslint, Hey API) get 6.0's, and tsc is 7's. The TypeScript
  # team's side-by-side setup: https://devblogs.microsoft.com/typescript/announcing-typescript-7-0/
  typescript: npm:@typescript/typescript6@^6.0.2
  "@typescript/native": npm:typescript@~7.0.2
  rehype-harden: ^1.1.8
  streamdown: ^2.7.1
  "@ai-sdk/react": ^4.0.150
  ai: ^7.0.146
  "@sentry/nextjs": ^11.8.0
  "@dnd-kit/core": ^6.3.1
