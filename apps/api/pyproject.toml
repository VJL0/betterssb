[project]
name = "betterssb-api"
version = "0.1.0"
description = "BetterSSB API server — schedule optimization, RMP proxy, chatbot, and transcript analysis"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.135.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.40",
    "asyncpg>=0.30.0",
    "alembic>=1.15.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
    "pydantic-settings>=2.7.0",
    "beautifulsoup4>=4.13.0",
    "lxml>=5.3.0",
    "authlib>=1.8.0",
    "itsdangerous>=2.2.0",
    "redis>=8.0.0",
    "httpx2>=2.13.1",
    "vercel>=0.12.0",
    "pydantic-ai-slim[google,groq]>=2.59.0",
    "sentry-sdk[fastapi]>=2.72.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0",
    "aiosqlite>=0.21.0",
    "ruff>=0.17.0",
]
ingest = [
    "pdfminer-six>=20260107",
    "pdfplumber>=0.11.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_empty = true
